display_information:
  name: SponsorOps
  description: Agentic outreach assistant. Researches prospects, drafts emails, tracks follow-ups.
  background_color: "#1f3a5f"
features:
  bot_user:
    display_name: SponsorOps
    always_online: true
  slash_commands:
    - command: /lead
      description: Research a company and draft outreach
      usage_hint: add <company> | optional context  (also: list, stats, help)
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
